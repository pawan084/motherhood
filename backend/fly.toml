# Fly.io deploy for the Aira backend. `fly launch` (or `fly deploy`) reads this.
# Set secrets with:  fly secrets set GEMINI_API_KEY=... ADMIN_JWT_SECRET=... \
#   APP_SESSION_SECRET=... APP_SHARED_SECRET=... GOOGLE_CLIENT_ID=... ENV=production
app = "aira-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  TRUST_FORWARDED_FOR = "1"   # Fly sets X-Forwarded-For; safe to trust behind it
  # Put the SQLite file on the mounted volume below. Without this db.py defaults
  # to /app/aira.db — inside the image layer, which is REPLACED on every deploy,
  # silently losing all data while the volume sits mounted and unused.
  SQLITE_PATH = "/data/aira.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "30s"
      timeout = "5s"

# A persistent volume keeps the SQLite file across deploys — paired with the
# SQLITE_PATH above, which is what actually puts the file here. Note a volume is
# attached to ONE machine, so this only holds while you run a single instance
# (auto_stop/auto_start of the same machine is fine). Prefer Postgres (set
# DATABASE_URL as a secret) for real production; then the volume is optional.
[mounts]
  source = "aira_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
