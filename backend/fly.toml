# Fly.io deploy for the Aira backend. `fly launch` (or `fly deploy`) reads this.
# Set secrets with:  fly secrets set GEMINI_API_KEY=... ADMIN_JWT_SECRET=... \
#   APP_SESSION_SECRET=... APP_SHARED_SECRET=... GOOGLE_CLIENT_ID=... ENV=production
app = "aira-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  TRUST_FORWARDED_FOR = "1"   # Fly sets X-Forwarded-For; safe to trust behind it

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "30s"
      timeout = "5s"

# A persistent volume keeps the SQLite file across deploys. Prefer Postgres
# (set DATABASE_URL as a secret) for real production; then the volume is optional.
[mounts]
  source = "aira_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
