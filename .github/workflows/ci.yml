# Continuous integration for all four codebases.
#
# This exists because backend/tests/test_client_contract.py opened with "This
# runs in CI" while the repository had no CI at all. That file is the one that
# catches a client silently dropping a field, and it was relying on somebody
# remembering to run it — which is the same shape as every defect it hunts: a
# statement asserting something the system did not do.
#
# Every job here was run locally and seen green before being added. A red job
# nobody trusts is worse than no job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run irrelevant; don't queue behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (315 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # requirements-dev.txt pulls in requirements.txt via -r.
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q
        env:
          # Deliberately absent, so the suite runs the way the app ships:
          # keyword-only screening, no classifier. Tests that need an LLM
          # response construct it rather than calling out.
          GEMINI_API_KEY: ""

  android-unit:
    name: android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: assemble + unit tests
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  android-instrumented:
    name: android instrumentation (rendered tree)
    runs-on: ubuntu-latest
    # ChatBubbleRenderTest asserts that disclaimer_needed, trust_label and
    # action_card reach the SCREEN. The contract test cannot see that storey —
    # trust_label reached the ViewModel and no bubble drew it, and no grep
    # could tell. It needs a real emulator, so it is slower than the rest and
    # worth every second.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read from apps/web/package.json's `engines.node` (>=22.13.0) rather
          # than hardcoded here. It was pinned to "20" and the build died on
          # `import { glob } from "node:fs/promises"`, which vinext needs and
          # Node 20 does not have — while the package had declared the
          # requirement all along and nothing was reading it.
          #
          # Naming the version in two places is how they drift. This way the
          # declaration is the only copy.
          node-version-file: apps/web/package.json
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      # `npm test` builds first and then runs the node:test suite — including
      # the check that the tutorial says the same thing on Android and on web,
      # which is a cross-client claim no single codebase can verify alone.
      - working-directory: apps/web
        run: npm test

  admin:
    name: admin console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - working-directory: apps/admin
        run: npm ci
      - working-directory: apps/admin
        run: npm run build
      # No lint step. `next lint` has no ESLint config in this project, so it
      # opens an interactive "How would you like to configure ESLint?" prompt
      # and exits 1 on a runner.
      #
      # It is here as a comment rather than removed silently: linting the admin
      # console is not covered, and choosing a config is a decision with real
      # churn behind it, not something to settle inside a CI fix.
      #
      # Added in the first place because I verified the build locally and not
      # the lint — against the rule stated one commit earlier, that nothing
      # goes in on the assumption it will pass.
