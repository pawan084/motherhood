# XcodeGen spec. On a Mac:  brew install xcodegen && cd apps/ios && xcodegen generate
# then open Aira.xcodeproj. The .xcodeproj is generated (gitignored), so this
# file is the source of truth for the project — no hand-edited pbxproj to rot.
name: Aira
options:
  bundleIdPrefix: com.aira.companion
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Aira:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Aira
    info:
      path: Aira/Info.plist
      properties:
        CFBundleDisplayName: Aira
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Dev only: lets the app reach the FastAPI backend over http on the local
        # network / localhost. Remove for a release build that talks to https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aira.companion.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
