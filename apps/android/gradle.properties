android.useAndroidX=true
kotlin.code.style=official

# Gradle's 512 MiB default heap is not enough to dex a Compose app — the daemon
# dies mid-build with "the JVM garbage collector is thrashing". These are the
# values the Android Studio project template ships with.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Aira backend base URL (BuildConfig.AIRA_API_BASE). When commented out it
# defaults to http://10.0.2.2:8000 — the host loopback from the Android EMULATOR.
#
# Physical device (uncomment ONE, or pass -PairaApiBase=... on the CLI):
#   Wi-Fi (device + PC on same network): http://<your-PC-LAN-IP>:8000
#         + allow inbound TCP 8000 through the PC firewall, AND add that IP to
#           app/src/debug/res/xml/network_security_config.xml (cleartext is
#           blocked by default; the file only allow-lists loopback hosts).
#   USB   (adb reverse tcp:8000 tcp:8000): http://127.0.0.1:8000  — already
#         allow-listed, so this needs no other change.
# airaApiBase=http://10.0.2.2:8000

# The backend's X-App-Token shared secret (BuildConfig.AIRA_APP_TOKEN), i.e. the
# server's APP_SHARED_SECRET. Leave blank for a zero-config dev backend. It is
# REQUIRED against production — app.py refuses to boot without APP_SHARED_SECRET,
# and every route 401s before identity is checked when the header is missing.
# Prefer passing it per-build (-PairaAppToken=...) over committing it here.
# airaAppToken=
